<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/calculatorstyle.css">
</head>
<body>
    <div class="calculator">
        
        <input type="text" placeholder="0" id="inputBox" aria-label="Calculator display" readonly>

        <div>
            <button aria-label="All clear" >AC</button>
            <button aria-label="Delete last digit" >DEL</button>
            <button aria-label="Percent">%</button>
            <button class="operator" aria-label="Divide">/</button>
        </div>
        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator" aria-label="Multiply">*</button>
        </div>
        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator" aria-label="Subtract">-</button>
        </div>
        <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator" aria-label="Add">+</button>
        </div>
        <div>
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button class="equal-btn" aria-label="Equals">=</button>
        </div>
    </div>

    <script src="../../js/calculator-script.js"></script>
</body>
</html>
