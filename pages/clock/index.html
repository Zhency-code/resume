<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../img/clock-icon.png">
    <link rel="stylesheet" href="../../css/clockstyle.css">
    <title>Analog Clock</title>
</head>
<body>
    <h1>This is an Analog Clock</h1>

    <div class="container">
        <div class="clock">

            <div id="hour" class="hand hour-hand"><i></i></div>
            <div id="min" class="hand min-hand"><i></i></div>
            <div id="sec" class="hand sec-hand"><i></i></div>
            <span style="--i:1;"><b>1</b></span>
            <span style="--i:2;"><b>2</b></span>
            <span style="--i:3;"><b>3</b></span>
            <span style="--i:4;"><b>4</b></span>
            <span style="--i:5;"><b>5</b></span>
            <span style="--i:6;"><b>6</b></span>
            <span style="--i:7;"><b>7</b></span>
            <span style="--i:8;"><b>8</b></span>
            <span style="--i:9;"><b>9</b></span>
            <span style="--i:10;"><b>10</b></span>
            <span style="--i:11;"><b>11</b></span>
            <span style="--i:12;"><b>12</b></span>
        </div>
    </div>

    <script src="../../js/clock-script.js"></script>
</body>
</html>
